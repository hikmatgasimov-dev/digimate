<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Register')}">
    <meta charset="UTF-8">
    <title>Register | DigiMate</title>
</head>

<body>

<header th:replace="~{fragments/layout :: nav('register')}"></header>

<main id="main-content" class="container">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <h1>Create an account</h1>

            <p class="text-muted">
                Join DigiMate to request help
                or volunteer to help others.
            </p>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form th:action="@{/register}"
                          th:object="${form}"
                          method="post">

                        <!-- Full name -->
                        <div class="mb-3">

                            <label class="form-label" for="fullName">Full name</label>

                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   th:field="*{fullName}"
                                   placeholder="Enter your full name"
                                   th:errorclass="is-invalid"
                                   maxlength="100"
                                   autocomplete="name"
                                   required>

                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label" for="email">Email</label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   th:field="*{email}"
                                   placeholder="you@example.com"
                                   th:errorclass="is-invalid"
                                   maxlength="255"
                                   autocomplete="email"
                                   required>

                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label" for="phone">Phone number</label>

                            <input type="tel"
                                   class="form-control"
                                   id="phone"
                                   th:field="*{phone}"
                                   placeholder="+371 20000000"
                                   th:errorclass="is-invalid"
                                   maxlength="30"
                                   autocomplete="tel"
                                   required
                                   aria-describedby="phone-hint">

                            <div class="form-text" id="phone-hint">
                                Your phone and email are shared only with the person you are matched with,
                                after a helper accepts.
                            </div>
                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label" for="password">Password</label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="Create a password"
                                   th:errorclass="is-invalid"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   required
                                   aria-describedby="password-hint">

                            <div class="form-text" id="password-hint">At least 8 characters</div>

                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                            </div>

                        </div>

                        <!-- Helper preference -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="wantsToHelp"
                                   th:field="*{wantsToHelp}" th:errorclass="is-invalid">
                            <label class="form-check-label" for="wantsToHelp">I also want to help others</label>
                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('wantsToHelp')}" th:errors="*{wantsToHelp}"></div>

                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            Create account
                        </button>

                    </form>
                </div>
            </div>

            <p class="text-center mt-3">
                Already have an account?
                <a th:href="@{/login}">
                    Log in
                </a>
            </p>
        </div>
    </div>

</main>

</body>
</html>
