
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Register')}">
    <meta charset="UTF-8">
    <title>Register | DigiMate</title>
</head>

<body>

<header th:replace="~{fragments/layout :: nav('register')}"></header>

<main id="main-content" class="container">

    <h1>Create an account</h1>

    <p class="muted">
        Join DigiMate to request help
        or volunteer to help others.
    </p>

    <form th:action="@{/register}"
          th:object="${form}"
          method="post">

        <!-- Full name -->
        <div class="form-group">

            <label for="fullName">Full name</label>

            <input type="text"
                   id="fullName"
                   th:field="*{fullName}"
                   placeholder="Enter your full name"
                   maxlength="100"
                   autocomplete="name"
                   th:attr="aria-invalid=${#fields.hasErrors('fullName')}"
                   required>

            <p class="field-error"
               th:if="${#fields.hasErrors('fullName')}"
               th:errors="*{fullName}"></p>

        </div>

        <!-- Email -->
        <div class="form-group">

            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="you@example.com"
                   maxlength="255"
                   autocomplete="email"
                   th:attr="aria-invalid=${#fields.hasErrors('email')}"
                   required>

            <p class="field-error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>

        </div>

        <!-- Phone -->
        <div class="form-group">

            <label for="phone">Phone number</label>

            <input type="tel"
                   id="phone"
                   th:field="*{phone}"
                   placeholder="+371 20000000"
                   maxlength="30"
                   autocomplete="tel"
                   th:attr="aria-invalid=${#fields.hasErrors('phone')}"
                   required>

            <p class="field-error"
               th:if="${#fields.hasErrors('phone')}"
               th:errors="*{phone}"></p>

        </div>

        <!-- Password -->
        <div class="form-group">

            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Create a password"
                   minlength="8"
                   maxlength="72"
                   autocomplete="new-password"
                   th:attr="aria-invalid=${#fields.hasErrors('password')}"
                   required>

            <small class="hint">
                Use a password with at least 8 characters.
            </small>

            <p class="field-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>

        </div>

        <!-- Helper preference -->
        <div class="form-group">

            <div class="checkbox-row">

                <input type="checkbox"
                       id="wantsToHelp"
                       th:field="*{wantsToHelp}">

                <label for="wantsToHelp">
                    I also want to help others
                </label>

            </div>

            <p class="field-error"
               th:if="${#fields.hasErrors('wantsToHelp')}"
               th:errors="*{wantsToHelp}"></p>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn">
            Create account
        </button>

    </form>

    <p class="muted">
        Already have an account?
        <a th:href="@{/login}">
            Log in
        </a>
    </p>

</main>

</body>
</html>
