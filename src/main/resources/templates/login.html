
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Log in')}">
    <meta charset="UTF-8">
    <title>Log in | DigiMate</title>
</head>

<body>

<header th:replace="~{fragments/layout :: nav('login')}"></header>

<main id="main-content" class="container">

    <h1>Log in</h1>

    <p class="muted">
        Welcome back to DigiMate.
        Enter your email and password to continue.
    </p>

    <!-- Wrong login details -->
    <p class="error"
       role="alert"
       th:if="${param.error}">
        Incorrect email or password.
        Please try again.
    </p>

    <!-- Successful logout -->
    <p class="success"
       th:if="${param.logout}">
        You have successfully logged out.
    </p>

    <!-- Successful registration -->
    <p class="success"
       th:if="${param.registered}">
        Your account was created successfully.
        You can now log in.
    </p>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
            <label for="username">Email</label>
            <input type="email"
                   id="username"
                   name="username"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>
        </div>

        <button type="submit" class="btn">
            Log in
        </button>

    </form>

    <p class="muted">
        Don't have an account?
        <a th:href="@{/register}">
            Create an account
        </a>
    </p>

</main>

</body>
</html>
