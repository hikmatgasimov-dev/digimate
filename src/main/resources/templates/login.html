<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Log in')}">
    <meta charset="UTF-8">
    <title>Log in | DigiMate</title>
</head>

<body>

<header th:replace="~{fragments/layout :: nav('login')}"></header>

<main id="main-content" class="container">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <h1>Log in</h1>

            <p class="text-muted">
                Welcome back to DigiMate.
                Enter your email and password to continue.
            </p>

            <!-- Wrong login details -->
            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                Incorrect email or password. Please try again.
            </div>
            <div class="alert alert-success" role="alert" th:if="${param.logout}">
                You have successfully logged out.
            </div>
            <div class="alert alert-success" role="alert" th:if="${param.registered}">
                Your account was created successfully. You can now log in.
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form th:action="@{/login}" method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label" for="username">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   autocomplete="email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   autocomplete="current-password"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            Log in
                        </button>

                    </form>
                </div>
            </div>

            <p class="text-center mt-3">
                Don't have an account?
                <a th:href="@{/register}">
                    Create an account
                </a>
            </p>
        </div>
    </div>

</main>

</body>
</html>
