<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title} + ' | DigiMate'">
        DigiMate
    </title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<header th:fragment="nav(active)">

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <nav class="site-nav container"
         aria-label="Main navigation">

        <a class="brand" th:href="@{/}">
            DigiMate
        </a>


        <div class="nav-links">

            <!-- Guests -->
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}"
                   th:attr="aria-current=${active == 'login'} ? 'page'">
                    Log in
                </a>

                <a th:href="@{/register}"
                   th:attr="aria-current=${active == 'register'} ? 'page'">
                    Register
                </a>
            </div>

            <!-- Normal users -->
            <div sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                <a th:href="@{/requests/my}"
                   th:attr="aria-current=${active == 'requests'} ? 'page'">
                    My requests
                </a>

                <a th:href="@{/requests/new}"
                   th:attr="aria-current=${active == 'new'} ? 'page'">
                    New request
                </a>

                <a th:href="@{/helper}"
                   th:attr="aria-current=${active == 'helper'} ? 'page'">
                    Helper inbox
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-button">
                        Log out
                    </button>
                </form>
            </div>

            <!-- Admin users -->
            <div sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/helpers}"
                   th:attr="aria-current=${active == 'admin-helpers'} ? 'page'">
                    Helpers
                </a>

                <a th:href="@{/admin/users}"
                   th:attr="aria-current=${active == 'admin-users'} ? 'page'">
                    All users
                </a>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-button">
                        Log out
                    </button>
                </form>
            </div>

        </div>


        </div>
    </nav>
</header>

</body>
</html>
