<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title} + ' | DigiMate'">
        DigiMate
    </title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Lexend:wght@500;700&amp;display=swap">


</head>

<body>

<header th:fragment="nav(active)">

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


    <nav class="navbar navbar-expand-md navbar-dark navbar-digimate"
         aria-label="Main navigation">

        <div class="container">

            <a class="navbar-brand brand" th:href="@{/}">
                DigiMate
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto">

                    <!-- Guests -->
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link"
                           th:href="@{/login}"
                           th:attr="aria-current=${active == 'login'} ? 'page'">
                            Log in
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link"
                           th:href="@{/register}"
                           th:attr="aria-current=${active == 'register'} ? 'page'">
                            Register
                        </a>
                    </li>

                    <!-- Normal users -->
                    <li class="nav-item"
                        sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/requests/my}"
                           th:attr="aria-current=${active == 'requests'} ? 'page'">
                            My requests
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/requests/new}"
                           th:attr="aria-current=${active == 'new'} ? 'page'">
                            New request
                        </a>
                    </li>

                    <li class="nav-item"
                        sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/helper}"
                           th:attr="aria-current=${active == 'helper'} ? 'page'">
                            Helper inbox
                        </a>
                    </li>

                    <!-- Admin users -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/admin/helpers}"
                           th:attr="aria-current=${active == 'admin-helpers'} ? 'page'">
                            Helpers
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link"
                           th:href="@{/admin/users}"
                           th:attr="aria-current=${active == 'admin-users'} ? 'page'">
                            All users
                        </a>
                    </li>

                    <!-- Log out -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="nav-button">
                                Log out
                            </button>
                        </form>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <script defer th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</header>

<!-- Shared success and error messages -->
<div th:fragment="messages">

    <div class="alert alert-success"
         role="alert"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="alert alert-danger"
         role="alert"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

</div>

<!-- Shared footer -->
<footer th:fragment="footer"
        class="text-center text-muted py-3 border-top">
    <p class="mb-0">
        © 2026 DigiMate. Digital help made simple.
    </p>
</footer>

</body>
</html>
