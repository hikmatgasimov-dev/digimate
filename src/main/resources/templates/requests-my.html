<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('My requests')}">
    <meta charset="UTF-8">
    <title>My requests | DigiMate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/app.css">
    <link rel="stylesheet" href="../static/css/pages.css">
</head>

<body>

<header th:replace="~{fragments/layout :: nav('requests')}"></header>

<main id="main-content" class="container my-requests">

    <h1>My requests</h1>

    <p class="ask-help" sec:authorize="!hasRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/requests/new}">Ask for help</a>
    </p>


    <!-- Success message -->
    <output class="alert alert-success d-block"
            th:if="${successMessage}"
            th:text="${successMessage}">
        Your request was sent.
    </output>

    <!-- Error message -->
    <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">
        Something went wrong.
    </div>

    <!-- Empty request list -->
    <p class="empty text-center text-muted"
       th:if="${#lists.isEmpty(requests)}">
        You have no requests yet. Choose ‘Ask for help’ to create one.
    </p>

    <!-- Request cards -->
    <th:block th:each="request : ${requests}">
        <article th:replace="~{fragments/request-parts :: customer-card(${request}, ${complaintStatuses})}"></article>
    </th:block>

</main>

</body>
</html>
