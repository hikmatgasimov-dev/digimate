<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My requests')}">
    <meta charset="UTF-8">
    <title>My requests | DigiMate</title>
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <h1>My requests</h1>
    <p><a class="btn" th:href="@{/requests/new}" href="request-new.html">Ask for help</a></p>

        </form>
    </article>

</html>
