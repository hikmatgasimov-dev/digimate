<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Helper inbox')}">
    <meta charset="UTF-8">
    <title>Helper inbox | DigiMate</title>
    <link rel="stylesheet" href="../static/css/app.css">
</head>
<body>
<header th:replace="~{fragments/layout :: nav('helper')}"></header>

<main id="main-content" class="container helper-inbox">
    <h1>Helper inbox</h1>

    <output class="alert alert-success d-block" th:if="${successMessage}" th:text="${successMessage}">You accepted the
        request.
    </output>
    <div class="alert alert-info" th:if="${errorMessage != null and openRequests == null}" th:text="${errorMessage}">
        Your helper account is not verified yet.
    </div>
    <div class="alert alert-danger" role="alert" th:if="${errorMessage != null and openRequests != null}"
         th:text="${errorMessage}">
        This request was just accepted by another helper.
    </div>

    <th:block th:if="${openRequests != null}">

        <section aria-labelledby="open-heading">
            <h2 id="open-heading" class="mt-5 mb-3">Open requests</h2>
            <p class="text-center text-muted py-4" th:if="${#lists.isEmpty(openRequests)}">
                There are no open requests right now.
            </p>

            <!--Open request card-->
            <th:block th:each="request : ${openRequests}">
                <article th:replace="~{fragments/request-parts :: open-card(${request})}"></article>
            </th:block>

        </section>

        <section aria-labelledby="mine-heading">
            <h2 id="mine-heading" class="mt-5 mb-3">My accepted requests</h2>
            <p class="text-center text-muted py-4" th:if="${#lists.isEmpty(myRequests)}">You have not accepted any
                requests yet.</p>

            <th:block th:each="request : ${myRequests}">
                <article th:replace="~{fragments/request-parts :: helping-card(${request})}"></article>
            </th:block>

        </section>
    </th:block>
</main>
</body>
</html>
