spring.application.name=digimate

# PostgreSQL (local). Every machine sets DB_USER and DB_PASSWORD as environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/digimate
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates the tables from the entities.
spring.jpa.hibernate.ddl-auto=update

# JWT: the secret comes from the environment (at least 32 characters), never from Git
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Behind the portal's HTTPS proxy: keep links and redirects on https
server.forward-headers-strategy=framework